<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>MARK VII · 结构线稿渲染</title>
<link rel="stylesheet" href="./css/mk7.css">
<script type="importmap">
{
  "imports": {
    "three": "./lib/three/three.module.js",
    "three/addons/": "./lib/three/addons/"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette"></div>

<header class="masthead">
  <p class="eyebrow">STRUCTURE STUDY · MK VII</p>
  <h1>MARK <span>VII</span></h1>
  <p class="sub">表面线稿渲染 · 保留装甲细节</p>
</header>

<aside class="stats">
  <div class="stat"><span class="k">TRIS</span><span class="v" id="st-tris">—</span></div>
  <div class="stat"><span class="k">FPS</span><span class="v" id="st-fps">—</span></div>
  <div class="stat"><span class="k">LINE</span><span class="v" id="st-line">100%</span></div>
</aside>

<nav class="toolbar" aria-label="渲染控制">
  <div class="tb-row">
    <button id="btn-rotate" class="on" title="自动旋转 (Space)">自动旋转</button>
    <button id="btn-invert" title="暗线 / 亮线 (L)">暗线</button>
    <button id="btn-reset" title="重置视角 (R)">重置</button>
    <button id="btn-shot" title="保存画面 (S)">截图</button>
    <button id="btn-full" title="全屏 (F)">全屏</button>
  </div>
  <div class="tb-sliders">
    <label class="slider" title="线稿强度">
      <span>线稿</span>
      <input id="rg-strength" type="range" min="0" max="1" step="0.01" value="0.85">
    </label>
    <label class="slider" title="线条粗细（像素）">
      <span>粗细</span>
      <input id="rg-width" type="range" min="0.4" max="2.2" step="0.05" value="1.05">
    </label>
  </div>
</nav>

<p class="hint">拖拽旋转 · 滚轮缩放 · 双击重置 · L 切换线色</p>
<a class="back" href="./mk85.html">MK85 实景 →</a>

<div class="loader" id="loader">
  <div class="ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34"></circle><circle id="prog" cx="40" cy="40" r="34"></circle></svg></div>
  <p class="pct" id="pct">0%</p>
  <p class="ld-text" id="ld-text">加载装甲模型…</p>
</div>

<div class="error hidden" id="error">
  <p class="err-title">加载失败</p>
  <p class="err-msg" id="err-msg"></p>
  <button id="btn-retry">重试</button>
</div>

<script type="module" src="./js/showcase7/main.js"></script>
</body>
</html>
