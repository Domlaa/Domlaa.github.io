<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARK LXXXV · 3D MODEL SHOWCASE</title>
<meta name="description" content="Iron Man Mark 85 high-detail 3D model viewer — real-time Three.js rendering with rotate, zoom and material switching">
<link rel="stylesheet" href="./css/showcase.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23e8b45a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffe1a8'/%3E%3C/svg%3E">
<script type="importmap">
{
  "imports": {
    "three": "./lib/three/three.module.js",
    "three/addons/": "./lib/three/addons/"
  }
}
</script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="masthead">
    <p class="eyebrow">IRON MAN · MARK LXXXV</p>
    <h1>MK<span>85</span></h1>
    <p class="sub">High-detail armor model · real-time FBX render</p>
  </header>

  <aside class="stats" id="stats">
    <div class="stat"><span class="k">MESHES</span><span class="v" id="st-mesh">--</span></div>
    <div class="stat"><span class="k">TRIANGLES</span><span class="v" id="st-tris">--</span></div>
    <div class="stat"><span class="k">FPS</span><span class="v" id="st-fps">--</span></div>
    <div class="stat"><span class="k">LOAD</span><span class="v" id="st-load">--</span></div>
  </aside>

  <nav class="toolbar" aria-label="View controls">
    <button id="btn-rotate" class="on" title="Auto-rotate (Space)">ROTATE</button>
    <button id="btn-explode" title="Disassemble (E)">DISASSEMBLE</button>
    <button id="btn-assemble" class="on" title="Assemble (A)">ASSEMBLE</button>
    <button id="btn-material" class="on" title="Cycle material (M)">MATERIAL · SUIT</button>
    <button id="btn-inner" title="Show / hide inner figure (I)">LINER · OFF</button>
    <button id="btn-shot" title="Save frame (S)">SHOT</button>
    <button id="btn-reset" title="Reset view (R)">RESET</button>
    <button id="btn-full" title="Fullscreen (F)">FULL</button>
  </nav>

  <p class="hint">Drag to rotate · scroll to zoom · double-click to reset · E disassemble / A assemble / I liner</p>
  <a class="back" href="./index.html">HOLOGRAPHIC VIEW →</a>
  <a class="back back2" href="./mk7.html">MK VII EDGE LINE →</a>

  <!-- 加载状态 -->
  <div class="loader" id="loader">
    <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
      <circle class="ring-bg" cx="32" cy="32" r="27"></circle>
      <circle class="ring-fg" id="ld-ring" cx="32" cy="32" r="27"></circle>
    </svg>
    <p class="ld-title">Loading armor model</p>
    <div class="bar"><i id="ld-bar"></i></div>
    <p class="ld-meta"><span id="ld-pct">0%</span><span id="ld-size">19.0 MB</span></p>
  </div>

  <!-- 错误状态 -->
  <div class="error hidden" id="error">
    <p class="err-title">MODEL LOAD FAILED</p>
    <p class="err-msg" id="err-msg"></p>
    <button onclick="location.reload()">RELOAD</button>
  </div>

  <script type="module" src="./js/showcase/main.js"></script>
</body>
</html>
